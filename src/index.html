<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="calculadora">
      <h1>Calculadora</h1>
      <p class="descricao">Utilize os quatro operadores aritméticos</p>

      <div class="display">
        <input type="number" id="numero1" placeholder="Primeiro número" step="any">
        <input type="number" id="numero2" placeholder="Segundo número" step="any">
      </div>

      <div class="botoes-operacao">
        <button type="button" onclick="selecionarOperador(this, '+')">+</button>
        <button type="button" onclick="selecionarOperador(this, '-')">−</button>
        <button type="button" onclick="selecionarOperador(this, '*')">×</button>
        <button type="button" onclick="selecionarOperador(this, '/')">÷</button>
      </div>

      <p id="operador-selecionado" class="operador-info">Selecione um operador acima</p>

      <button type="button" class="botao-principal" onclick="calcular()">Calcular</button>

      <div id="resultado">Resultado:</div>

      <!-- ===== SEÇÃO DE HISTÓRICO ===== -->
      <div id="historico" style="display: none;">
        <div class="historico-header">
          <span class="historico-titulo">📋 Histórico</span>
          <button type="button" class="botao-limpar" onclick="limparHistorico()">Limpar</button>
        </div>
        <ul id="lista-historico"></ul>
      </div>

    </section>
  </main>

  <script>
    var operadorAtual = null;

    function selecionarOperador(btn, op) {
      operadorAtual = op;
      var labels = { '+': 'Adição (+)', '-': 'Subtração (−)', '*': 'Multiplicação (×)', '/': 'Divisão (÷)' };
      document.getElementById('operador-selecionado').textContent = 'Operador: ' + labels[op];
      document.querySelectorAll('.botoes-operacao button').forEach(function(b) { b.classList.remove('ativo'); });
      btn.classList.add('ativo');
    }

    function calcular() {
      var n1 = parseFloat(document.getElementById('numero1').value);
      var n2 = parseFloat(document.getElementById('numero2').value);
      var resultado = document.getElementById('resultado');

      if (isNaN(n1) || isNaN(n2)) {
        resultado.textContent = 'Erro: Por favor, digite dois números válidos.';
        resultado.className = 'erro';
        return;
      }
      if (operadorAtual === null) {
        resultado.textContent = 'Erro: Selecione um operador antes de calcular.';
        resultado.className = 'erro';
        return;
      }

      var valor;
      if (operadorAtual === '+') valor = n1 + n2;
      else if (operadorAtual === '-') valor = n1 - n2;
      else if (operadorAtual === '*') valor = n1 * n2;
      else if (operadorAtual === '/') {
        if (n2 === 0) {
          resultado.textContent = 'Erro: Divisão por zero não é permitida.';
          resultado.className = 'erro';
          return;
        }
        valor = n1 / n2;
      }

      var simbolos = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      resultado.textContent = 'Resultado: ' + n1 + ' ' + simbolos[operadorAtual] + ' ' + n2 + ' = ' + valor;
      resultado.className = '';

      // ✅ Registra no histórico após cálculo bem-sucedido
      adicionarAoHistorico(n1, operadorAtual, n2, valor);
    }

    // ===================================================
    // ✨ NOVA FEATURE: HISTÓRICO DE CÁLCULOS (JavaScript)
    // ===================================================
    // Armazena os últimos 10 cálculos realizados na sessão
    var historicoCalculos = [];

    /**
     * adicionarAoHistorico()
     * Registra uma operação no array de histórico e atualiza a UI.
     * Limita o histórico a 10 entradas (as mais recentes ficam no topo).
     *
     * @param {number}  n1       - Primeiro operando
     * @param {string}  operador - Operador utilizado (+, -, *, /)
     * @param {number}  n2       - Segundo operando
     * @param {number}  resultado - Resultado da operação
     */
    function adicionarAoHistorico(n1, operador, n2, resultado) {
      var simbolos = { '+': '+', '-': '−', '*': '×', '/': '÷' };

      var entrada = {
        expressao : n1 + ' ' + simbolos[operador] + ' ' + n2,
        resultado : resultado,
        timestamp : new Date().toLocaleTimeString('pt-BR')
      };

      historicoCalculos.unshift(entrada);           // insere no topo
      if (historicoCalculos.length > 10) {
        historicoCalculos.pop();                    // remove o mais antigo
      }

      renderizarHistorico();
    }

    /**
     * renderizarHistorico()
     * Re-renderiza a lista de histórico na tela com base em `historicoCalculos`.
     * Oculta a seção quando o histórico está vazio.
     */
    function renderizarHistorico() {
      var secao = document.getElementById('historico');
      var lista  = document.getElementById('lista-historico');

      if (historicoCalculos.length === 0) {
        secao.style.display = 'none';
        return;
      }

      secao.style.display = 'block';
      lista.innerHTML = '';

      historicoCalculos.forEach(function(item) {
        var li = document.createElement('li');
        li.className = 'historico-item';
        li.innerHTML =
          '<span class="historico-expressao">'
          + item.expressao + ' = <strong>' + item.resultado + '</strong>'
          + '</span>'
          + '<span class="historico-hora">' + item.timestamp + '</span>';
        lista.appendChild(li);
      });
    }

    /**
     * limparHistorico()
     * Esvazia o array de histórico e atualiza a interface,
     * ocultando a seção automaticamente.
     */
    function limparHistorico() {
      historicoCalculos = [];
      renderizarHistorico();
    }
    // ===================================================
  </script>
</body>
</html>
