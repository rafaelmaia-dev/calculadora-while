<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="calculadora">
      <h1>Calculadora</h1>
      <p class="descricao">Utilize os quatro operadores aritméticos</p>

      <div class="display">
        <input type="number" id="numero1" placeholder="Primeiro número" step="any">
        <input type="number" id="numero2" placeholder="Segundo número" step="any">
      </div>

      <div class="botoes-operacao">
        <button type="button" onclick="selecionarOperador(this, '+')">+</button>
        <button type="button" onclick="selecionarOperador(this, '-')">−</button>
        <button type="button" onclick="selecionarOperador(this, '*')">×</button>
        <button type="button" onclick="selecionarOperador(this, '/')">÷</button>
      </div>

      <p id="operador-selecionado" class="operador-info">Selecione um operador acima</p>

      <button type="button" class="botao-principal" onclick="calcular()">Calcular</button>

      <div id="resultado">Resultado:</div>
    </section>
  </main>

  <script>
    var operadorAtual = null;

    function selecionarOperador(btn, op) {
      operadorAtual = op;
      var labels = { '+': 'Adição (+)', '-': 'Subtração (−)', '*': 'Multiplicação (×)', '/': 'Divisão (÷)' };
      document.getElementById('operador-selecionado').textContent = 'Operador: ' + labels[op];
      document.querySelectorAll('.botoes-operacao button').forEach(function(b) { b.classList.remove('ativo'); });
      btn.classList.add('ativo');
    }

    function calcular() {
      var n1 = parseFloat(document.getElementById('numero1').value);
      var n2 = parseFloat(document.getElementById('numero2').value);
      var resultado = document.getElementById('resultado');

      if (isNaN(n1) || isNaN(n2)) {
        resultado.textContent = 'Erro: Por favor, digite dois números válidos.';
        resultado.className = 'erro';
        return;
      }
      if (operadorAtual === null) {
        resultado.textContent = 'Erro: Selecione um operador antes de calcular.';
        resultado.className = 'erro';
        return;
      }

      var valor;
      if (operadorAtual === '+') valor = n1 + n2;
      else if (operadorAtual === '-') valor = n1 - n2;
      else if (operadorAtual === '*') valor = n1 * n2;
      else if (operadorAtual === '/') {
        if (n2 === 0) {
          resultado.textContent = 'Erro: Divisão por zero não é permitida.';
          resultado.className = 'erro';
          return;
        }
        valor = n1 / n2;
      }

      var simbolos = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      resultado.textContent = 'Resultado: ' + n1 + ' ' + simbolos[operadorAtual] + ' ' + n2 + ' = ' + valor;
      resultado.className = '';
    }
  </script>
</body>
</html>
