<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <section class="calculadora">
      <h1>Calculadora</h1>
      <p class="descricao">Utilize os quatro operadores aritméticos</p>

      <div class="display">
        <label for="numero1">Primeiro número</label>
        <input type="number" id="numero1" placeholder="Primeiro número" step="any" />

        <label for="numero2">Segundo número</label>
        <input type="number" id="numero2" placeholder="Segundo número" step="any" />
      </div>

      <div class="botoes-operacao">
        <button type="button" data-operador="+">+</button>
        <button type="button" data-operador="-">−</button>
        <button type="button" data-operador="*">×</button>
        <button type="button" data-operador="/">÷</button>
      </div>

      <p id="operador-selecionado" class="operador-info">Selecione um operador acima</p>

      <button type="button" id="btn-calcular" class="botao-principal">Calcular</button>

      <div id="resultado" aria-live="polite">Resultado:</div>

      <section id="historico">
        <div class="historico-header">
          <strong>Histórico</strong>
          <button type="button" id="limpar-historico" class="botao-limpar">Limpar</button>
        </div>
        <ul id="lista-historico"></ul>
      </section>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
