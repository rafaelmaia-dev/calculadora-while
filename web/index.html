<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="calculadora">
      <h1>Calculadora</h1>
      <p class="descricao">Utilize os quatro operadores aritméticos</p>

      <div class="display">
        <input type="number" id="numero1" placeholder="Primeiro número" step="any">
        <input type="number" id="numero2" placeholder="Segundo número" step="any">
      </div>

      <div class="botoes-operacao">
        <button type="button" onclick="selecionarOperador(this, '+')">+</button>
        <button type="button" onclick="selecionarOperador(this, '-')">−</button>
        <button type="button" onclick="selecionarOperador(this, '*')">×</button>
        <button type="button" onclick="selecionarOperador(this, '/')">÷</button>
      </div>

      <p id="operador-selecionado" class="operador-info">Selecione um operador acima</p>
      <button type="button" class="botao-principal" onclick="calcular()">Calcular</button>
      <div id="resultado">Resultado:</div>
    </section>
  </main>

  <!-- Mesma lógica de operacoes.py rodando no navegador (Pyodide) -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  <script>
    var pyodideReady = false;
    var operacao_aritmetica_python = null;

    function operacoes_py_code() {
      return `
def operacao_aritmetica(n1, n2, operador):
    if operador == '+':
        return n1 + n2
    elif operador == '-':
        return n1 - n2
    elif operador == '*':
        return n1 * n2
    elif operador == '/':
        if n2 == 0:
            raise ValueError('Divisão por zero não é permitida.')
        return n1 / n2
    else:
        raise ValueError('Operador inválido. Use +, -, *, ou /.')
`;
    }

    window.addEventListener('load', function() {
      loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/' }).then(function(pyodide) {
        pyodide.runPython(operacoes_py_code());
        operacao_aritmetica_python = pyodide.globals.get('operacao_aritmetica');
        pyodideReady = true;
      }).catch(function(err) {
        console.error('Pyodide load error:', err);
      });
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
