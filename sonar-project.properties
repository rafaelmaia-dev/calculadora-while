# ──────────────────────────────────────────────
# Identificação do projeto
# ──────────────────────────────────────────────
sonar.projectKey=rafaelmaia-dev_calculadora-while
sonar.organization=rafaelmaia-dev
sonar.host.url=https://sonarcloud.io

# ──────────────────────────────────────────────
# Fontes e testes
# ──────────────────────────────────────────────
sonar.sources=.
sonar.tests=tests
sonar.inclusions=src/python/**/*.py
sonar.exclusions=web/**,**/__pycache__/**,**/*.pyc

# ──────────────────────────────────────────────
# Python
# ──────────────────────────────────────────────
sonar.python.version=3.13

# ──────────────────────────────────────────────
# Cobertura de testes (gerado pelo pytest-cov)
# ──────────────────────────────────────────────
sonar.python.coverage.reportPaths=coverage.xml

# ──────────────────────────────────────────────
# Encoding
# ──────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

